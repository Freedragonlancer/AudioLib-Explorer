[build]
target = "x86_64-pc-windows-msvc"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# Prevent asio-sys from implicitly downloading an unpinned SDK when ASIO is enabled.
# Prepare this fixed directory with tools/prepare-asio.ps1 before an ASIO build.
CPAL_ASIO_DIR = { value = "tools/.build-tools/asio-2.3.4/ASIOSDK", relative = true }
# Independent search readers must not serialize every allocation on SQLite's
# global memory-statistics mutex. Keep SQLite's thread safety and cache limits;
# this application does not use its global memory-status/heap-limit interfaces.
# Large x64 libraries can place FTS5/covering indexes past SQLite's default 2 GiB
# mapping ceiling. This is a virtual, demand-paged limit; the VFS may fall back
# to ordinary reads without allocating this amount of resident memory.
# Both flags are portable SQLite options, including on macOS aarch64. The mmap
# flag raises only the compile-time ceiling: writers use zero; readers enable it
# only on verified Windows fixed volumes. macOS/unknown/network volumes use zero.
# Set AUDIOLIB_DISABLE_MMAP before startup to disable every reader mapping.
LIBSQLITE3_FLAGS = "-DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_MAX_MMAP_SIZE=68719476736LL"

