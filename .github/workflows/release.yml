# Release packages are built, validated and published on local machines:
#   - Windows x64 ASIO client (AudioLibExplorer-<tag>-win-x64-portable.zip)
#   - macOS arm64 server     (AudioLibServer-<tag>-macos-arm64.tar.gz)
# each with a .sha256, via tools/release-create.sh <tag> <assets...> or
# `gh release upload <tag> <files>`. Pre-release status is derived from the tag
# by tools/release-create.sh (vX.Y.Z-beta.N / -rc.N => --prerelease --latest=false).
#
# This workflow is VERIFY-ONLY. It has no push/tag trigger (workflow_dispatch
# only), builds nothing, and never creates, edits or uploads a release or asset
# (permissions: contents: read). Run it manually after the local upload to check
# that the release carries exactly the four expected assets with valid checksums.
# See doc/Rust_Versioning.md.
name: Release verify

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (vX.Y.Z, vX.Y.Z-rc.N or vX.Y.Z-beta.N)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify published release assets (read-only)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Verify the release has the client and macOS server packages with SHA-256
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -cnotmatch '^v(\d+\.\d+\.\d+)(-(rc|beta)\.\d+)?$') { throw "Tag '$($env:RELEASE_TAG)' must be vX.Y.Z, vX.Y.Z-rc.N or vX.Y.Z-beta.N." }
          $expectPre = [bool]$Matches[2]
          $json = gh release view $env:RELEASE_TAG --json name,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw "Release $($env:RELEASE_TAG) not found or not readable." }
          $rel = $json | ConvertFrom-Json
          if ($rel.name -cne "AudioLib Explorer $($env:RELEASE_TAG)") { throw "Release title '$($rel.name)' does not match tag." }
          if ([bool]$rel.isPrerelease -ne $expectPre) { throw "Release prerelease flag $($rel.isPrerelease) does not match tag (expected $expectPre)." }
          $packages = @("AudioLibExplorer-$env:RELEASE_TAG-win-x64-portable.zip", "AudioLibServer-$env:RELEASE_TAG-macos-arm64.tar.gz")
          $assetNames = @($rel.assets | ForEach-Object name)
          $missing = @()
          foreach ($p in $packages) { foreach ($n in @($p, "$p.sha256")) { if ($assetNames -cnotcontains $n) { $missing += $n } } }
          if ($missing) { throw "Missing release assets: $($missing -join ', ')" }
          # Download (read-only) into a temp dir and check each SHA-256 file.
          $dir = Join-Path $env:RUNNER_TEMP 'release-verify'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($p in $packages) {
            gh release download $env:RELEASE_TAG --dir $dir --pattern $p --pattern "$p.sha256"
            if ($LASTEXITCODE -ne 0) { throw "Download of $p failed." }
            $parts = (Get-Content -LiteralPath (Join-Path $dir "$p.sha256") -Raw).Trim() -split '\s+'
            if ($parts.Count -ne 2 -or $parts[1].TrimStart('*') -cne $p -or $parts[0] -notmatch '^[0-9A-Fa-f]{64}$') { throw "Malformed checksum file for $p." }
            if ((Get-FileHash -LiteralPath (Join-Path $dir $p) -Algorithm SHA256).Hash -ine $parts[0]) { throw "Checksum mismatch for $p." }
            "OK $p"
          }
