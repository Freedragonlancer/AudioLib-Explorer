name: CI

# Runtime checks run locally under AGENTS.md. Hosted CI checks formatting only.
on:
  push:
    branches: [main, beta, 'codex/**']
    paths-ignore:
      - '**/*.md'
      - 'doc/**'
      - 'resources/screenshot-*.png'
  # No paths filter on PRs: "Linux (fmt)" is a required check on main/beta and
  # must report for every PR, including doc-only changes.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Linux (fmt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned formatter
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - name: Format
        run: cargo fmt --all -- --check
