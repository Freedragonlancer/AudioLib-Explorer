[package]
name = "audiolib-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
asio = []

[dependencies]
audiolib-core = { path = "../audiolib-core" }
serde.workspace = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# OLE drag source (CF_HDROP) for dragging files out of the desktop app.
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cc = "1.2"

